input:
  screener_path: runs/data/nasdaq_screener_1779374047283.csv
  symbol_col: Symbol
  etf_filter:
    enabled: true
    column: null
    exclude_values: ["1", "true", "yes", "y", "etf", "fund"]
  security_filter:
    enabled: true
    name_column: Name
    exclude_name_patterns:
      - '\bRights?\b'
      - '\bWarrants?\b'
      - '\bUnits?\b'
      - '\bPreferred\b'
      - '\bNotes?\b'
      - '\bStructured Products?\b'
      - '\bTrust Securities\b'
    exclude_symbol_patterns:
      - '\^'
    exclude_column_values:
      Industry: ["Blank Checks"]

download:
  start: "2020-01-01"
  end: "2026-01-01"
  batch_size: 25
  retries: 3
  pause_seconds: 6.0

quality:
  min_coverage: 0.95
  max_gap: 3
  min_final_tickers: 100

output:
  raw_close: runs/data/raw_close.csv
  filled_close: runs/data/filled_close.csv
  dropped_tickers: runs/data/dropped_tickers.csv
