seed: 1508

data:
  prices_path: "runs/data/filled_close.csv"

pair_selection:
  min_obs: 120          # dead 
  min_corr: 0.75
  max_corr: 1.0
  max_eg_pvalue: 0.05
  min_half_life: 10
  max_half_life: 30.0
  max_hurst: 0.45
  max_pairs: 30

backtest:
  initial_capital: 1000000.0
  start: "2022-01-01"
  end: "2026-01-01"
  walkforward:
    enabled: true
    train_mode: "rolling"
    train_months: 18
    test_months: 6
    step_months: 6

strategy:
  entry_z: 1.5
  exit_z: 0.0
  stop_z: 3.0
  z_window: 20
  z_min_periods: 5
  max_hold_half_life_multiplier: 1.5
  cooldown_days: 1

markov:
  enabled: true
  horizon_days: 25
  min_revert_prob: 0.80
  min_train_observations: 30
  min_state_observations: 5
  transition_smoothing: 0.0
  neutral_z: 0.5
  entry_z: null

risk:
  max_pair_weight: 0.05
  max_drawdown: 1.0

costs:
  fee_bps: 1.0
  slippage_bps: 0.5

bo:
  enabled: false
  init_points: 40
  n_iter: 150
  ranges:
    entry_z: [1.5, 2.5]
    exit_z: [0.0, 0.5]
    stop_z: [3.0, 4.0]
    min_revert_prob: [0.60, 1.0]
    horizon_days: [10, 50]
output:
  dir: "runs/results/backtest"

logging:
  level: "INFO"
