seed: 1508

data:
  prices_path: "runs/data/filled_close.csv"

pair_selection:
  min_obs: 120          # dead 
  min_corr: 0.70
  max_eg_pvalue: 0.05
  min_half_life: 2.0
  max_half_life: 60.0
  max_hurst: 0.5
  max_pairs: 10

backtest:
  initial_capital: 100000.0
  start: "2020-03-01"
  end: "2026-03-01"
  walkforward:
    enabled: true
    train_mode: "rolling"
    train_months: 12
    test_months: 6
    step_months: 6

strategy:
  entry_z: 1.0
  exit_z: 0.0
  stop_z: 3.0
  z_window: 45
  z_min_periods: 5
  max_hold_days: 150
  cooldown_days: 1

markov:
  enabled: true
  horizon_days: 60
  min_revert_prob: 0.70
  min_train_observations: 30
  min_state_observations: 5
  transition_smoothing: 0.0
  neutral_z: 0.5
  entry_z: null

risk:
  max_open_pairs: 20
  max_pair_weight: 0.05
  max_drawdown: 0.25

costs:
  fee_bps: 1.0
  slippage_bps: 0.0

bo:
  enabled: true
  init_points: 5
  n_iter: 15
  ranges:
    entry_z: [0.8, 2.0]
    exit_z: [0.0, 0.5]
    stop_z: [2.0, 4.0]
    min_revert_prob: [0.70, 0.85]
    horizon_days: [20, 90]
  cv:
    n_blocks: 5
    k_test_blocks: 2
    purge: 0
    embargo: 0.0

output:
  dir: "runs/results/backtest"

logging:
  level: "INFO"
