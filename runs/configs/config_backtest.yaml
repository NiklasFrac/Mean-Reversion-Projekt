seed: 1508

data:
  prices_path: "runs/data/filled_close.csv"
  screener_path: "runs/data/nasdaq_screener_1779374047283.csv"

pair_selection:
  min_corr: 0.80
  max_corr: 1.0
  max_eg_pvalue: 0.05
  fdr_enabled: true
  fdr_alpha: 0.05
  use_half_life_filter: true
  use_hurst_filter: true
  min_half_life: 3
  max_half_life: 20.0
  max_hurst: 0.45
  max_pairs: 10


backtest:
  initial_capital: 100000.0
  start: "2023-01-01"
  end: "2026-01-01"
  walkforward:
    enabled: true
    train_mode: "rolling"
    train_months: 18
    test_months: 6
    step_months: 6

strategy:
  entry_z: 1.5
  exit_z: -0.5
  stop_z: 2.5
  z_window_multiplier: 2.0
  max_hold_half_life_multiplier: 2
  cooldown_days: 1

risk:
  max_pair_weight: 0.1

costs:
  cost_bps: 3

bo:
  enabled: true
  init_points: 40
  n_iter: 150
  validation_fraction: 0.3
  ranges:
    entry_z: [1.0, 2.5]
    exit_z: [-0.5, 0.5]
    stop_z: [3.0, 3.5]

gridsearch:
  enabled: false
  values:
    entry_z: [1.5, 1.75, 2.0]
    exit_z: [0.0, 0.25, 0.5, 0.75] 
    stop_z: [2.5, 2.75, 3.0]
output:
  dir: "runs/results"

logging:
  level: "INFO"
