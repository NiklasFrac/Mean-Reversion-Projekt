[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonprojekt"
version = "0.1.0"
description = "Download and backtest pipelines for quantitative research."
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "pyyaml>=6.0",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
backtest = [
  "bayesian-optimization>=1.4",
  "matplotlib>=3.9",
  "statsmodels>=0.14",
]
[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "statsmodels>=0.14",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backtest*", "download*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "unit: fast, isolated test coverage",
  "integration: multi-component or end-to-end coverage",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.uv]
default-groups = ["dev"]
